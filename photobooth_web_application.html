<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 PhotoBooth</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        celeste: '#C8D9E6',
                        navy: '#2E435B',
                        teal: '#5B8193',
                        beige: '#F2ECE7',
                    },
                    fontFamily: {
                        serif: ['Georgia', 'Cambria', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #C8D9E6;
            font-family: 'Georgia', serif;
            color: #2E435B;
        }

        /* Filter Styles for Video Preview and Rendered Canvas */
        .filter-normal { filter: none; }
        .filter-bw { filter: grayscale(100%); }
        .filter-sepia { filter: sepia(100%); }
        .filter-frio { filter: hue-rotate(180deg) saturate(120%) brightness(105%); }
        .filter-calido { filter: sepia(35%) saturate(140%) brightness(105%); }
        .filter-vintage { filter: sepia(50%) contrast(120%) brightness(90%) hue-rotate(-10deg); }

        /* Flash overlay animation */
        @keyframes flash-animation {
            0% { opacity: 0.9; }
            100% { opacity: 0; }
        }
        .flash-effect {
            animation: flash-animation 0.4s ease-out forwards;
        }

        .mirrored {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 md:p-8">

    <!-- HEADER -->
    <header class="text-center my-4">
        <h1 class="text-4xl md:text-5xl font-bold tracking-wider text-navy uppercase drop-shadow-sm">PHOTOBOOTH</h1>
        <p class="text-teal italic text-lg mt-1 font-medium">Captura tus momentos favoritos</p>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-4xl flex flex-col items-center gap-6">

        <!-- CAMERA VIEWPORT -->
        <div class="relative w-full max-w-2xl bg-navy rounded-2xl overflow-hidden shadow-2xl border-4 border-navy aspect-video flex items-center justify-center">
            
            <!-- Video Stream -->
            <video id="video" autoplay playsinline class="w-full h-full object-cover mirrored filter-normal"></video>
            
            <!-- Hidden Canvas for capturing raw frames -->
            <canvas id="captureCanvas" class="hidden"></canvas>

            <!-- Camera Placeholder / Off State -->
            <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-navy text-beige p-6 text-center">
                <svg class="w-16 h-16 mb-3 animate-pulse text-teal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <p class="text-lg font-semibold">Iniciando cámara...</p>
                <p class="text-xs text-beige/70 mt-1">Por favor concede los permisos para acceder a la cámara web.</p>
            </div>

            <!-- Countdown Overlay -->
            <div id="countdownOverlay" class="absolute inset-0 flex items-center justify-center bg-navy/40 backdrop-blur-xs hidden pointer-events-none">
                <span id="countdownText" class="text-8xl md:text-9xl font-extrabold text-white drop-shadow-lg animate-bounce">3</span>
            </div>

            <!-- Flash Effect Overlay -->
            <div id="flashOverlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none"></div>

            <!-- Mirror Toggle Button -->
            <button id="toggleMirrorBtn" title="Invertir vista previa" class="absolute top-4 right-4 bg-navy/70 hover:bg-navy text-white p-2 rounded-full transition shadow-md backdrop-blur-xs">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                </svg>
            </button>
        </div>

        <!-- FILTER SELECTION -->
        <div class="w-full flex flex-col items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="font-bold text-navy text-base">Filtros:</span>
                <span id="activeFilterLabel" class="italic text-teal font-medium">Normal</span>
            </div>

            <div class="flex flex-wrap justify-center gap-2 max-w-xl">
                <button onclick="setFilter('Normal', 'filter-normal')" class="filter-btn active-filter bg-teal hover:bg-navy text-white text-xs md:text-sm font-semibold py-2 px-4 rounded-xl transition shadow-sm">Normal</button>
                <button onclick="setFilter('Blanco y Negro', 'filter-bw')" class="filter-btn bg-teal hover:bg-navy text-white text-xs md:text-sm font-semibold py-2 px-4 rounded-xl transition shadow-sm">Blanco y Negro</button>
                <button onclick="setFilter('Sepia', 'filter-sepia')" class="filter-btn bg-teal hover:bg-navy text-white text-xs md:text-sm font-semibold py-2 px-4 rounded-xl transition shadow-sm">Sepia</button>
                <button onclick="setFilter('Frio', 'filter-frio')" class="filter-btn bg-teal hover:bg-navy text-white text-xs md:text-sm font-semibold py-2 px-4 rounded-xl transition shadow-sm">Frío</button>
                <button onclick="setFilter('Calido', 'filter-calido')" class="filter-btn bg-teal hover:bg-navy text-white text-xs md:text-sm font-semibold py-2 px-4 rounded-xl transition shadow-sm">Cálido</button>
                <button onclick="setFilter('Vintage', 'filter-vintage')" class="filter-btn bg-teal hover:bg-navy text-white text-xs md:text-sm font-semibold py-2 px-4 rounded-xl transition shadow-sm">Vintage</button>
            </div>
        </div>

        <!-- CAPTURE ACTION BUTTON -->
        <button id="startBtn" onclick="iniciarFotografias()" class="bg-navy hover:bg-teal text-white font-bold text-lg md:text-xl py-3 px-8 rounded-2xl shadow-xl transform active:scale-95 transition-all flex items-center gap-3 my-2 border-2 border-beige/20">
            <span>📸</span>
            <span>TOMAR 3 FOTOS</span>
        </button>

    </main>

    <!-- FOOTER -->
    <footer class="mt-8 text-center text-xs text-navy/70">
        <p>FotoBooth Web App &bull; Inspirado en Python Tkinter Edition</p>
    </footer>

    <!-- MODAL FOR RESULT / PHOTO STRIP -->
    <div id="resultModal" class="fixed inset-0 bg-navy/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-celeste rounded-3xl max-w-2xl w-full max-h-[92vh] flex flex-col items-center p-6 shadow-2xl border-4 border-white/40 overflow-hidden">
            
            <h2 class="text-2xl md:text-3xl font-bold text-navy mb-3 text-center">¡Tus fotos están listas!</h2>
            
            <!-- Canvas Strip Container -->
            <div class="flex-1 w-full overflow-y-auto flex justify-center py-2 my-2 custom-scrollbar">
                <canvas id="polaroidStripCanvas" class="max-w-full h-auto rounded-lg shadow-lg border border-navy/10"></canvas>
            </div>

            <!-- Modal Action Buttons -->
            <div class="flex flex-wrap justify-center gap-4 mt-4 w-full">
                <button onclick="guardarFotos()" class="bg-navy hover:bg-teal text-white font-bold py-3 px-6 rounded-xl shadow-md transition flex items-center gap-2">
                    <span>💾</span>
                    <span>GUARDAR FOTOS</span>
                </button>
                <button onclick="cerrarModal()" class="bg-teal hover:bg-navy text-white font-medium py-3 px-6 rounded-xl shadow-md transition">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <script>
        // GLOBAL CONSTANTS & STATE
        const VERSICULO = "El da fuerzas al cansado y aumenta el vigor al que no tiene fuerzas.";
        const REFERENCIA = "Isaías 40:29 (TLA)";
        
        let activeFilterClass = 'filter-normal';
        let activeFilterName = 'Normal';
        let fotosTomadas = [];
        let isCapturing = false;
        let isMirrored = true;

        // HTML ELEMENTS
        const video = document.getElementById('video');
        const captureCanvas = document.getElementById('captureCanvas');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownText = document.getElementById('countdownText');
        const flashOverlay = document.getElementById('flashOverlay');
        const startBtn = document.getElementById('startBtn');
        const activeFilterLabel = document.getElementById('activeFilterLabel');
        const toggleMirrorBtn = document.getElementById('toggleMirrorBtn');
        const resultModal = document.getElementById('resultModal');
        const polaroidStripCanvas = document.getElementById('polaroidStripCanvas');

        // INITIALIZE CAMERA STREAM
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
                    audio: false
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    cameraPlaceholder.classList.add('hidden');
                };
            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                cameraPlaceholder.innerHTML = `
                    <p class="text-red-300 font-bold text-lg mb-1">⚠️ Error de Cámara</p>
                    <p class="text-xs text-beige/80">No se pudo acceder a la cámara web. Asegúrate de otorgar los permisos en tu navegador.</p>
                `;
            }
        }

        // TOGGLE MIRRORING
        toggleMirrorBtn.addEventListener('click', () => {
            isMirrored = !isMirrored;
            if (isMirrored) {
                video.classList.add('mirrored');
            } else {
                video.classList.remove('mirrored');
            }
        });

        // CHANGE ACTIVE FILTER
        function setFilter(nombre, filterClass) {
            activeFilterName = nombre;
            activeFilterClass = filterClass;
            activeFilterLabel.textContent = nombre;

            // Remove existing filter classes from video preview
            video.className = video.className.replace(/filter-\w+/g, '');
            video.classList.add(filterClass);

            // Highlight active button visually
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-navy');
                btn.classList.add('bg-teal');
            });
            event.target.classList.remove('bg-teal');
            event.target.classList.add('bg-navy');
        }

        // START CAPTURE SEQUENCE (3 PHOTOS)
        function iniciarFotografias() {
            if (isCapturing) return;
            
            fotosTomadas = [];
            isCapturing = true;
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');

            ejecutarCuentaRegresiva(3, 1);
        }

        function ejecutarCuentaRegresiva(segundosRestantes, numeroFoto) {
            countdownOverlay.classList.remove('hidden');
            countdownText.textContent = segundosRestantes;

            if (segundosRestantes > 0) {
                setTimeout(() => {
                    ejecutarCuentaRegresiva(segundosRestantes - 1, numeroFoto);
                }, 1000);
            } else {
                countdownOverlay.classList.add('hidden');
                tomarUnaFoto();

                if (numeroFoto < 3) {
                    setTimeout(() => {
                        ejecutarCuentaRegresiva(3, numeroFoto + 1);
                    }, 1200);
                } else {
                    setTimeout(() => {
                        terminarSesion();
                    }, 800);
                }
            }
        }

        // TAKE INDIVIDUAL SNAPSHOT
        function tomarUnaFoto() {
            // Trigger Flash Animation
            flashOverlay.classList.remove('flash-effect');
            void flashOverlay.offsetWidth; // Trigger reflow
            flashOverlay.classList.add('flash-effect');

            const ctx = captureCanvas.getContext('2d');
            captureCanvas.width = video.videoWidth || 1280;
            captureCanvas.height = video.videoHeight || 720;

            ctx.save();
            if (isMirrored) {
                ctx.translate(captureCanvas.width, 0);
                ctx.scale(-1, 1);
            }

            // Apply selected filter to canvas context before drawing image
            ctx.filter = getCanvasFilterStyle(activeFilterClass);
            ctx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
            ctx.restore();

            // Save image data URL
            fotosTomadas.push(captureCanvas.toDataURL('image/jpeg', 0.95));
        }

        // CONVERT CSS FILTERS TO CANVAS FILTER STRINGS
        function getCanvasFilterStyle(filterClass) {
            switch (filterClass) {
                case 'filter-bw': return 'grayscale(100%)';
                case 'filter-sepia': return 'sepia(100%)';
                case 'filter-frio': return 'hue-rotate(180deg) saturate(120%) brightness(105%)';
                case 'filter-calido': return 'sepia(35%) saturate(140%) brightness(105%)';
                case 'filter-vintage': return 'sepia(50%) contrast(120%) brightness(90%) hue-rotate(-10deg)';
                default: return 'none';
            }
        }

        // FINISH SESSION & RENDER POLAROIDS
        function terminarSesion() {
            isCapturing = false;
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            if (fotosTomadas.length === 3) {
                generarTiraPolaroid();
            }
        }

        // GENERATE VERTICAL POLAROID STRIP ON CANVAS
        async function generarTiraPolaroid() {
            const width = 600;
            const photoHeight = 400; // Calculated aspect ratio for render
            const topMargin = 30;
            const sideMargin = 30;
            const bottomMargin = 220; // Space for text/verses
            const cardHeight = photoHeight + topMargin + bottomMargin;
            const cardSpacing = 25;
            const outerPadding = 40;

            const stripWidth = width + (sideMargin * 2) + (outerPadding * 2);
            const stripHeight = (cardHeight * 3) + (cardSpacing * 2) + (outerPadding * 2);

            polaroidStripCanvas.width = stripWidth;
            polaroidStripCanvas.height = stripHeight;

            const ctx = polaroidStripCanvas.getContext('2d');

            // 1. Draw Background (#C8D9E6)
            ctx.fillStyle = '#C8D9E6';
            ctx.fillRect(0, 0, stripWidth, stripHeight);

            // Get Current Date
            const dateObj = new Date();
            const fechaStr = `${String(dateObj.getDate()).padStart(2, '0')} / ${String(dateObj.getMonth() + 1).padStart(2, '0')} / ${dateObj.getFullYear()}`;

            // Helper to load HTML images
            const loadImage = src => new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = src;
            });

            // Draw each Polaroid card
            let currentY = outerPadding;

            for (let i = 0; i < fotosTomadas.length; i++) {
                const img = await loadImage(fotosTomadas[i]);

                // Polaroid White Background Box
                const cardX = outerPadding;
                const cardW = width + (sideMargin * 2);
                
                ctx.fillStyle = '#FFFFFF';
                // Subtle shadow effect
                ctx.shadowColor = 'rgba(46, 67, 91, 0.15)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
                ctx.fillRect(cardX, currentY, cardW, cardHeight);

                // Reset Shadow
                ctx.shadowColor = 'transparent';

                // Photo Area
                const photoX = cardX + sideMargin;
                const photoY = currentY + topMargin;
                ctx.drawImage(img, photoX, photoY, width, photoHeight);

                // Date Text
                ctx.textAlign = 'center';
                ctx.font = 'bold 32px Georgia, serif';
                ctx.fillStyle = '#2E435B';
                const dateY = photoY + photoHeight + 45;
                ctx.fillText(fechaStr, cardX + (cardW / 2), dateY);

                // Decorative Divider Line
                ctx.strokeStyle = '#D9E3EA';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cardX + (cardW * 0.2), dateY + 20);
                ctx.lineTo(cardX + (cardW * 0.8), dateY + 20);
                ctx.stroke();

                // Verse Text
                ctx.font = '20px Georgia, serif';
                ctx.fillStyle = '#5B8193';
                const verseY = dateY + 50;

                // Wrap Verse text to fit within card bounds
                const maxVerseWidth = cardW - 80;
                const lines = wrapText(ctx, VERSICULO, maxVerseWidth);
                let lineY = verseY;
                
                lines.forEach(line => {
                    ctx.fillText(line, cardX + (cardW / 2), lineY);
                    lineY += 28;
                });

                // Verse Reference
                ctx.font = 'bold 16px Georgia, serif';
                ctx.fillStyle = '#2E435B';
                ctx.fillText(REFERENCIA, cardX + (cardW / 2), lineY + 10);

                currentY += cardHeight + cardSpacing;
            }

            // Show Modal with Generated Strip
            resultModal.classList.remove('hidden');
        }

        // TEXT WRAPPING HELPER FOR CANVAS
        function wrapText(ctx, text, maxWidth) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                const word = words[i];
                const width = ctx.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        // DOWNLOAD GENERATED STRIP
        function guardarFotos() {
            const imageURL = polaroidStripCanvas.toDataURL('image/jpeg', 0.95);
            const downloadLink = document.createElement('a');
            const now = new Date();
            const timeStamp = now.toISOString().replace(/[:.]/g, '-').slice(0, 19);
            
            downloadLink.href = imageURL;
            downloadLink.download = `PhotoBooth_Polaroid_${timeStamp}.jpg`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        // CLOSE MODAL
        function cerrarModal() {
            resultModal.classList.add('hidden');
        }

        // INITIALIZE APPLICATION ON LOAD
        window.onload = function() {
            initCamera();
        };
    </script>
</body>
</html>
